<form (submit)="onSubmit($event)">
  <h2 mat-dialog-title>
    {{ 'auth.selectBranch.dialog.createTitle' | translate }}
  </h2>

  <mat-dialog-content>
    <div class="flex flex-col gap-2 pt-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ 'auth.selectBranch.dialog.name' | translate }}</mat-label>
        <input
          matInput
          type="text"
          autocomplete="off"
          [formField]="branchForm.name"
          [attr.aria-label]="'auth.selectBranch.dialog.name' | translate"
        />
        @if (branchForm.name().touched() && branchForm.name().invalid()) {
          <mat-error>{{ branchForm.name().errors() | fieldError }}</mat-error>
        }
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">
      {{ 'auth.selectBranch.dialog.cancel' | translate }}
    </button>
    <button mat-flat-button color="primary" type="submit">
      {{ 'auth.selectBranch.dialog.create' | translate }}
    </button>
  </mat-dialog-actions>
</form>
