<div
  class="relative flex min-h-dvh flex-col items-center justify-center gap-4 bg-[var(--mat-sys-surface-container)] p-4 sm:p-6"
>
  <div class="absolute top-3 right-3 z-10 sm:top-4 sm:right-4">
    <app-settings-menu />
  </div>

  <div
    class="grid w-full max-w-4xl overflow-hidden rounded-3xl bg-[var(--mat-sys-surface)] shadow-xl md:grid-cols-2"
  >
    <aside
      class="auth-hero relative isolate flex min-h-56 flex-col justify-center overflow-hidden px-8 py-10 md:min-h-[28rem] md:px-12"
    >
      <!--
        Sin barra inicial: con ella el navegador la resuelve contra la raíz del dominio y saltea
        el `<base href>`, así que en un deploy bajo subpath (`/blue-productos/`) la imagen se
        pedía fuera de la app. Relativa, resuelve contra `document.baseURI`, que es lo que el
        build fija con `--base-href`.
      -->
      <img
        ngSrc="images/backgrounds/auth-bg.png"
        fill
        priority
        alt=""
        aria-hidden="true"
        sizes="(min-width: 768px) 50vw, 100vw"
        class="-z-10 object-cover"
      />
      <div class="auth-hero__scrim absolute inset-0 -z-10"></div>

      <h1 class="mb-4 text-3xl font-bold tracking-tight md:text-4xl">
        {{ titleKey() | translate }}
      </h1>
      <p class="auth-hero__description max-w-sm text-sm leading-relaxed md:text-base">
        {{ descriptionKey() | translate }}
      </p>
    </aside>

    <div class="flex flex-col justify-center px-8 py-10 md:px-12 md:py-14">
      <ng-content />
    </div>
  </div>

  <app-version-info />
</div>
