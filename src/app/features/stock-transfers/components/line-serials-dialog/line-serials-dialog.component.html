<h2 mat-dialog-title class="serials__title">
  <mat-icon class="serials__title-icon" aria-hidden="true">qr_code_2</mat-icon>
  {{ 'stockTransfers.lineSerials.title' | translate: { count: data.serials.length } }}
</h2>

<mat-dialog-content>
  <p class="serials__lead">
    {{ 'stockTransfers.lineSerials.lead' | translate: { product: data.productName } }}
  </p>

  <!--
    Una lista y no un párrafo separado por comas: quien recibe busca un número para cotejarlo
    contra una caja, y en un renglón corrido «SN-A14-0041» y «SN-A14-0047» se confunden.
  -->
  <ul class="serials__list">
    @for (serial of data.serials; track serial) {
      <li class="serials__item">{{ serial }}</li>
    }
  </ul>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" type="button" [mat-dialog-close]="true">
    {{ 'stockTransfers.lineSerials.close' | translate }}
  </button>
</mat-dialog-actions>
